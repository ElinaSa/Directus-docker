version: "3"
services:
  directus:
    image: directus/directus:latest
    ports:
      - 8055:8055
    environment:
      KEY: "supersecretkey"
      ADMIN_EMAIL: "admin@example.com"
      ADMIN_PASSWORD: "admin"
      DATABASE_CLIENT: "sqlite3"
      DATABASE_FILENAME: "data.db"
    volumes:
      - ./data:/directus/data
